<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You died · Daniel David</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230e0d0b'/%3E%3Cpath d='M16 5c3 4 6 7 6 12a6 6 0 0 1-12 0c0-3 1.5-5 3-6.5 0 2.5 1 4 3 4.5-1-3 0-7 0-10z' fill='%23c9a35a'/%3E%3C/svg%3E">
  <!-- Self-contained: GitHub Pages serves this file for any missing path, so relative
       links to the stylesheets would break on nested URLs. -->
  <style>
    @font-face {
      font-family: 'Cormorant Garamond';
      src: url('/GameDevWebPortfolio/assets/fonts/cormorant-garamond.woff2') format('woff2'),
           url('assets/fonts/cormorant-garamond.woff2') format('woff2');
      font-weight: 300 700;
      font-display: swap;
    }
    :root {
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid; align-items: center;
      background: #0e0d0b;
      color: #e6e0d2;
      font-family: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 1.0625rem;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: #c9a35a; color: #14110c; }
    .band {
      display: grid; justify-items: center; gap: 1rem;
      padding: clamp(2.5rem, 8vh, 5rem) 1.5rem;
      background: #000;
      text-align: center;
      animation: fade 900ms ease-out both;
    }
    h1 {
      margin: 0;
      font-family: 'Cormorant Garamond', 'Palatino Linotype', Palatino, serif;
      font-weight: 500;
      font-size: clamp(3.5rem, 1rem + 10vw, 9rem);
      line-height: 1;
      letter-spacing: 0.06em;
      color: #b3261e;
      animation: omen 3600ms linear 200ms both;
    }
    p { margin: 0; color: #a39b8a; animation: fade 900ms ease-out 1400ms both; }
    a {
      display: inline-flex; align-items: center;
      min-height: 3rem; padding: 0 1.4rem; margin-top: 1rem;
      background: #c9a35a; color: #14110c;
      font-weight: 500; text-decoration: none;
      transition: transform 140ms var(--ease-out), background-color 200ms ease;
      animation: fade 900ms ease-out 1700ms both;
    }
    a:active { transform: scale(0.97); }
    a:focus-visible { outline: 2px solid #c9a35a; outline-offset: 4px; }
    @media (hover: hover) and (pointer: fine) { a:hover { background: #d8b46c; } }
    @keyframes omen {
      from { opacity: 0; transform: scale(0.97); }
      40% { opacity: 1; }
      to { opacity: 1; transform: scale(1.04); }
    }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      h1 { animation-name: fade; animation-duration: 900ms; }
    }
  </style>
</head>
<body>
  <main class="band">
    <h1>YOU DIED</h1>
    <p>This page does not exist. It may never have.</p>
    <a id="retry" href="./">Try again</a>
  </main>
  <script>
    // On GitHub Pages the site lives under /GameDevWebPortfolio/, so send people there.
    if (location.hostname.endsWith('github.io')) {
      const repo = location.pathname.split('/')[1];
      document.getElementById('retry').href = repo ? `/${repo}/` : '/';
    }
  </script>
</body>
</html>
